[project]
name = "gba-nba"
version = "0.1.0"
description = "GBA AI Sales Cockpit — Next Best Action task engine (stateful, MongoDB)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.170",
    "uvicorn[standard]>=0.54,<0.60",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pymongo>=4.20,<5",
    "sqlalchemy>=2.1,<2.2",
    "pymssql>=2.4,<2.5",
    "httpx>=0.28.1,<1",
    "structlog>=26.1,<27",
    "apscheduler>=3.11.3,<4",
    "numpy>=2.5,<2.6",
    "pandas>=3.1,<3.2",
    "scikit-learn==1.9.0",
    "joblib>=1.6,<2",
    "pyarrow>=26,<27",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
    "httpx2>=2.16,<3",
    "mongomock>=4.3,<5",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: DB-backed smoke against the dev ConcordDb_V5 (skipped without DB_* env; run via 'make integration')",
]
